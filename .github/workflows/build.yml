name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Read build number
        id: ver
        run: |
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' project.yml | sed -E 's/[^0-9]//g')
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Kertas.xcodeproj \
            -scheme Kertas \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "error:" build.log | sort -u | head -n 150 || true
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log || true
          test -d build/Build/Products/Release-iphoneos/Kertas.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Kertas.app Payload/
          zip -qry "Kertas_build${{ steps.ver.outputs.build }}.ipa" Payload
          ls -lh *.ipa

      - name: Publish release with the IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ steps.ver.outputs.build }}"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "Kertas_build${{ steps.ver.outputs.build }}.ipa" \
            --title "Kertas build ${{ steps.ver.outputs.build }}" \
            --notes "Unsigned IPA for sideloading (AltStore / Sideloadly)."
