name: Kertas
options:
  bundleIdPrefix: com.ridhuan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"
targets:
  Kertas:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Kertas Scan.
        NSUserActivityTypes:
          - com.ridhuan.kertas.tool
        INAlternativeAppNames:
          - INAlternativeAppName: PDF Scanner
          - INAlternativeAppName: Scanner
          - INAlternativeAppName: Kertas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF document
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Image
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
        NSCameraUsageDescription: Scan paper documents with the camera.
        NSPhotoLibraryUsageDescription: Pick photos of documents to straighten and turn into PDFs.
        NSPhotoLibraryAddUsageDescription: Save page images to your photo library.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridhuan.kertas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Manual
